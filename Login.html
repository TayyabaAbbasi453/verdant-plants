<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Verdant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">


<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 100px 0 60px;
    position: relative;
    background: linear-gradient(160deg, var(--beige) 0%, #eef5ec 55%, var(--white) 100%);
  }
  [data-theme="dark"] .auth-page {
    background: linear-gradient(160deg, #16261F 0%, #11201A 100%);
  }
  .auth-card {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 44px 40px;
    box-shadow: var(--shadow-lift);
    animation: fadeUp .6s ease both;
  }
  @media (max-width: 576px) { .auth-card { padding: 32px 22px; } }
  .auth-visual {
    border-radius: var(--radius-lg);
    overflow: hidden;
    height: 100%;
    min-height: 520px;
    box-shadow: var(--shadow-lift);
  }
  .auth-visual img { width: 100%; height: 100%; object-fit: cover; }
  .input-pw-wrap { position: relative; }
  .input-pw-wrap .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--ink-soft); }
  .divider-text { position: relative; text-align: center; }
  .divider-text::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--border-soft); }
  .divider-text span { position: relative; background: var(--bg); padding: 0 12px; font-size: .82rem; color: var(--ink-soft); }
</style>
</head>
<body>

<div class="page-loader"><i class="bi bi-tree-fill loader-leaf"></i></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-glass">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html"><i class="bi bi-flower1"></i>Verdant</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><i class="bi bi-list fs-2"></i></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="Pages/Shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="Pages/About.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="Pages/Contact.html">Contact</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-btn dark-toggle" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        <a href="Pages/Cart.html" class="icon-btn position-relative" aria-label="Cart">
          <i class="bi bi-bag"></i><span class="badge-count cart-badge" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="leaves-bg"></div>
  <div class="container position-relative">
    <div class="row g-4 align-items-center justify-content-center">

      <!-- Visual panel (desktop only) -->
      <div class="col-lg-5 d-none d-lg-block">
        <div class="auth-visual">
          <img src="images/mian-img.jpg" alt="Green lush plant collection">
        </div>
      </div>

      <!-- Form -->
      <div class="col-sm-10 col-md-8 col-lg-5">
        <div class="auth-card">
          <div class="text-center mb-4">
            <a href="index.html" class="brand-logo d-inline-block mb-2"><i class="bi bi-flower1"></i>Verdant</a>
            <h2 class="font-display mt-2" style="font-size:1.8rem;">Welcome Back</h2>
            <p class="text-muted small">Sign in to your account to continue shopping</p>
          </div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginEmail">Email Address</label>
              <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginPassword">Password</label>
              <div class="input-pw-wrap">
                <input type="password" id="loginPassword" class="form-control pe-5" placeholder="Enter your password" required>
                <button type="button" class="toggle-pw" aria-label="Show password"><i class="bi bi-eye"></i></button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small" for="rememberMe">Remember Me</label>
              </div>
              <a href="#" class="small text-dark-green">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-leaf w-100 btn-lg">Sign In <i class="bi bi-arrow-right ms-1"></i></button>
          </form>

          <div class="divider-text my-4"><span>or</span></div>

          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary w-100 btn-sm" onclick="VERDANT.toast('OAuth coming soon', 'info')"><i class="bi bi-google me-1"></i>Google</button>
            <button class="btn btn-outline-secondary w-100 btn-sm" onclick="VERDANT.toast('OAuth coming soon', 'info')"><i class="bi bi-facebook me-1"></i>Facebook</button>
          </div>

          <p class="text-center text-muted small mt-4 mb-0">Don't have an account? <a href="../Register.html" class="text-dark-green fw-semibold">Create one</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/auth.js"></script>
<script src="js/detail.js"></script>
</body>
</html>
