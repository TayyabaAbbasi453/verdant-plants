<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Verdant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 100px 0 60px;
    position: relative;
    background: linear-gradient(160deg, var(--beige) 0%, #eef5ec 55%, var(--white) 100%);
  }
  [data-theme="dark"] .auth-page {
    background: linear-gradient(160deg, #16261F 0%, #11201A 100%);
  }
  .auth-card {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 44px 40px;
    box-shadow: var(--shadow-lift);
    animation: fadeUp .6s ease both;
  }
  @media (max-width: 576px) { .auth-card { padding: 32px 22px; } }
  .auth-visual {
    border-radius: var(--radius-lg);
    overflow: hidden;
    height: 100%;
    min-height: 600px;
    box-shadow: var(--shadow-lift);
  }
  .auth-visual img { width: 100%; height: 100%; object-fit: cover; }
  .input-pw-wrap { position: relative; }
  .input-pw-wrap .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--ink-soft); }
  .perk-item { display: flex; align-items: center; gap: 10px; font-size: .88rem; }
  .perk-item i { color: var(--primary-green); font-size: 1rem; }
</style>
</head>
<body>

<div class="page-loader"><i class="bi bi-tree-fill loader-leaf"></i></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-glass">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html"><i class="bi bi-flower1"></i>Verdant</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><i class="bi bi-list fs-2"></i></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="Pages/Shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="Pages/About.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="Pages/Contact.html">Contact</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-btn dark-toggle" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        <a href="Pages/Cart.html" class="icon-btn position-relative" aria-label="Cart">
          <i class="bi bi-bag"></i><span class="badge-count cart-badge" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="leaves-bg"></div>
  <div class="container position-relative">
    <div class="row g-4 align-items-start justify-content-center">

      <!-- Visual -->
      <div class="col-lg-5 d-none d-lg-block">
        <div class="auth-visual">
          <img src="images/main-img2.avif" alt="Beautiful plant collection">
        </div>
      </div>

      <!-- Form -->
      <div class="col-sm-10 col-md-8 col-lg-5">
        <div class="auth-card">
          <div class="text-center mb-4">
            <a href="index.html" class="brand-logo d-inline-block mb-2"><i class="bi bi-flower1"></i>Verdant</a>
            <h2 class="font-display mt-2" style="font-size:1.8rem;">Join Verdant</h2>
            <p class="text-muted small">Create your free account and start growing 🌿</p>
          </div>

          <!-- Perks -->
          <div class="d-flex flex-column gap-2 mb-4 p-3 rounded-3" style="background:var(--surface);">
            <div class="perk-item"><i class="bi bi-check-circle-fill"></i> Save your wishlist &amp; cart</div>
            <div class="perk-item"><i class="bi bi-check-circle-fill"></i> Exclusive member discounts</div>
            <div class="perk-item"><i class="bi bi-check-circle-fill"></i> Order history &amp; tracking</div>
          </div>

          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="regName">Full Name</label>
              <input type="text" id="regName" class="form-control" placeholder="Jane Smith" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="regEmail">Email Address</label>
              <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="regPassword">Password</label>
              <div class="input-pw-wrap">
                <input type="password" id="regPassword" class="form-control pe-5" placeholder="Create a password" required>
                <button type="button" class="toggle-pw" aria-label="Show/hide password"><i class="bi bi-eye"></i></button>
              </div>
              <div class="progress mt-2" style="height:5px;border-radius:4px;">
                <div id="strengthBar" class="progress-bar" role="progressbar" style="width:0%"></div>
              </div>
              <small id="strengthText" class="text-muted"></small>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="regConfirm">Confirm Password</label>
              <div class="input-pw-wrap">
                <input type="password" id="regConfirm" class="form-control pe-5" placeholder="Repeat your password" required>
                <button type="button" class="toggle-pw" aria-label="Show/hide password"><i class="bi bi-eye"></i></button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agreeTerms" required>
              <label class="form-check-label small" for="agreeTerms">
                I agree to the <a href="#" class="text-dark-green">Terms of Service</a> and <a href="#" class="text-dark-green">Privacy Policy</a>
              </label>
            </div>

            <button type="submit" class="btn btn-leaf w-100 btn-lg">Create Account <i class="bi bi-arrow-right ms-1"></i></button>
          </form>

          <p class="text-center text-muted small mt-4 mb-0">Already have an account? <a href="../Login.html" class="text-dark-green fw-semibold">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
